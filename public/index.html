<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>musik.build — loop workstation</title>
<style>
  :root{
    --bg:#14120c; --panel:#1d1a12; --panel2:#282215; --line:#4d4433;
    --text:#f2e9d0; --dim:#a49a80;
    --drum:#ff5c47; --i808:#ff9e3d; --keys:#3fe8a0; --bars:#c990ff;
    --accent:#ffb000; --ok:#3dff7f; --human:#7cc6ff; --agent:#ffb000; --cable:#e09f3e;
    --hard:3px 3px 0 rgba(0,0,0,.6);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:24px 24px}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.13) 2px 4px)}
  button{background:var(--panel2);color:var(--text);border:2px solid var(--line);
    border-top-color:#6e6350;border-left-color:#6e6350;padding:8px 13px;font-size:13px;
    cursor:pointer;font-family:var(--mono);box-shadow:var(--hard)}
  button:hover{border-color:var(--accent);color:#fff}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.6)}
  button.primary{background:var(--accent);border-color:#8f6a10;border-top-color:#ffdf9a;border-left-color:#ffdf9a;color:#1b1200;font-weight:800}
  button.on{background:var(--ok);border-color:#0d5c2c;border-top-color:#9dffc4;border-left-color:#9dffc4;color:#04250f;font-weight:800}
  button.mini{padding:4px 9px;font-size:12px;box-shadow:none}

  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:3px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap}
  .logo{font-weight:800;font-size:20px;letter-spacing:2px;text-transform:uppercase;
    text-shadow:2px 2px 0 var(--accent),4px 4px 0 rgba(63,232,160,.4)}
  .logo b{color:var(--keys)}
  .sub{font-size:11px;color:var(--dim)}
  .modetag{font-size:10px;padding:2px 7px;border:1px solid var(--line);letter-spacing:.5px}
  .modetag.mock{color:var(--i808)} .modetag.live{color:var(--ok);border-color:#0d5c2c}
  .spacer{flex:1}
  .chip{padding:6px 11px;border:2px solid var(--line);cursor:pointer;font-size:12px;font-weight:700;box-shadow:var(--hard)}
  .chip.human{color:var(--human);border-color:#2c4c6b} .chip.agent{color:var(--agent);border-color:#8f6a10}
  .acct{position:relative}
  .acctMenu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:2px solid var(--line);
    box-shadow:var(--hard);min-width:150px;z-index:40;padding:8px;flex-direction:column;gap:6px}
  .acctMenu.show{display:flex}
  .acctHandle{font-size:12px;color:var(--text);font-weight:700;padding:2px 4px;border-bottom:1px solid var(--line);padding-bottom:7px}
  .acctMenu button{width:100%;box-shadow:none;text-align:left}
  #logoutBtn{color:var(--drum);border-color:#7c1226}
  /* per-node controls under the loopbar */
  .nodeCtrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px;padding:8px;background:var(--bg);border:2px solid var(--line)}
  #playBtn{width:40px;height:40px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--ok);border:2px solid #0d5c2c;border-top-color:#9dffc4;border-left-color:#9dffc4;color:#04250f;
    box-shadow:0 0 10px rgba(61,255,127,.3),var(--hard)}
  #playBtn.playing{background:var(--drum);border-color:#7c1226;border-top-color:#ffada0;border-left-color:#ffada0;color:#2b0410}
  .alignCtl{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);cursor:pointer;border:2px solid var(--line);padding:5px 8px;box-shadow:var(--hard)}
  .alignCtl input{accent-color:var(--accent)}
  .alignBpm{width:52px;background:var(--bg);color:var(--text);border:2px solid var(--line);font-family:var(--mono);padding:4px;font-size:12px}
  .alignBpm:disabled{opacity:.45}

  .knob{display:flex;flex-direction:column;gap:1px;font-size:10px;color:var(--dim);min-width:78px}
  .knob .val{color:var(--text);font-weight:700} .knob input{width:100%;accent-color:var(--accent)}
  .moodBtns{display:flex;border:2px solid var(--line);box-shadow:var(--hard)}
  .moodBtns button{border:none;box-shadow:none;padding:7px 10px} .moodBtns button:active{transform:none}
  .moodBtns button.on{background:var(--accent);color:#1b1200;font-weight:800}

  main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px 20px;align-items:start}
  @media (max-width:1040px){main{grid-template-columns:1fr}}
  .leftcol{display:flex;flex-direction:column;gap:16px;min-width:0}

  /* ---- graph ---- */
  .graphPane{background:var(--panel);border:3px solid var(--line);box-shadow:var(--hard);padding:12px}
  .paneTop{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .paneTop h3{margin:0;font-size:14px;letter-spacing:1px}
  .paneTop .hint{font-size:10px;color:var(--dim)}
  .paneTop .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .graphArea{position:relative;height:300px;background:var(--bg);border:2px solid var(--line);overflow:hidden;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px}
  #edgeSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #edgeSvg path.hit{pointer-events:stroke;cursor:pointer}
  .gnode{position:absolute;width:132px;background:var(--panel2);border:2px solid var(--line);
    border-top-color:#6e6350;border-left-color:#6e6350;box-shadow:var(--hard);padding:8px;cursor:grab;user-select:none;touch-action:none}
  .gnode:active{cursor:grabbing}
  .gnode canvas{width:100%;height:42px;background:var(--bg);border:1px solid #0e0c07;image-rendering:pixelated;display:block}
  .gnode .nname{font-size:12px;font-weight:800;margin:5px 0 2px;background:#f2e9d0;color:#1d1a12;padding:2px 6px;transform:rotate(-.6deg);display:flex;align-items:center;gap:4px}
  .gnode .nmeta{font-size:10px;color:var(--dim);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .gnode .nmeta button{padding:1px 6px;font-size:10px;box-shadow:none}
  .gnode.selected{border-color:var(--accent);box-shadow:3px 3px 0 rgba(255,176,0,.5)}
  .gnode.activeNode{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok),var(--hard)}
  .gnode.startNode .nname::before{content:'🏁';font-size:11px}
  .gnode.ghostNode{border-style:dashed;border-color:rgba(255,255,255,.6);opacity:.9;animation:pulse 1.2s steps(2) infinite}
  .gnode .nx{position:absolute;top:3px;right:6px;font-size:12px;color:var(--dim);cursor:pointer;display:none}
  .gnode:hover .nx{display:block}
  .gnode .port{position:absolute;right:-8px;top:50%;width:14px;height:14px;background:var(--cable);border:2px solid var(--bg);cursor:crosshair;transform:translateY(-50%)}
  .gnode .ghostBtns{display:flex;gap:4px;margin-top:5px}
  .gnode .ghostBtns button{flex:1;padding:2px 4px;font-size:10px;box-shadow:none}

  /* ---- canvas ---- */
  .board{background:var(--panel);border:3px solid var(--line);padding:12px;box-shadow:var(--hard)}
  .loopbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .loopbar .tt{font-size:15px;font-weight:800} .loopbar .au{font-size:11px;color:var(--dim)}
  .loopbar .editing{font-size:11px;color:var(--keys)}
  .lineage{display:none;font-size:11px;color:var(--dim);border:1px dashed var(--line);padding:3px 8px}
  .lineage b{color:var(--bars)}
  .section{margin-bottom:9px}
  .secHead{display:flex;align-items:center;gap:8px;margin:2px 0 5px}
  .secName{font-size:12px;font-weight:800;letter-spacing:1.5px}
  .sec-drums .secName{color:var(--drum)} .sec-k808 .secName{color:var(--i808)}
  .sec-keys .secName{color:var(--keys)} .sec-bars .secName{color:var(--bars)}
  .secHint{font-size:10px;color:var(--dim)} .secHead .mini{margin-left:auto}
  .grid{display:grid;gap:2px;touch-action:none;user-select:none}
  .rowLabel{font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:5px;height:22px}
  .cell{height:22px;background:#2b2617;border:1px solid #0e0c07;cursor:pointer;position:relative;
    font-size:9px;display:flex;align-items:center;justify-content:center;color:#0e0c07;overflow:hidden}
  .cell:hover{border-color:#fff} .cell.q{background:#363019}
  .cell.ph{box-shadow:inset 0 0 0 100px rgba(255,255,255,.13)}
  .sec-drums .cell.on{background:var(--drum);border-color:#8f2318}
  .sec-k808 .cell.on{background:var(--i808);border-color:#8f5a10}
  .sec-keys .cell.on{background:var(--keys);border-color:#0e6b4a}
  .sec-bars .cell.on{background:var(--bars);border-color:#6a3aa0}
  .sec-bars .cell.hasword{color:#1b1200;font-weight:700}
  .cell.ghost{outline:2px dashed rgba(255,255,255,.75);outline-offset:-2px;animation:pulse 1s steps(2) infinite}
  .sec-drums .cell.ghost{background:rgba(255,92,71,.4)} .sec-k808 .cell.ghost{background:rgba(255,158,61,.4)}
  .sec-keys .cell.ghost{background:rgba(63,232,160,.4)} .sec-bars .cell.ghost{background:rgba(201,144,255,.4)}
  @keyframes pulse{50%{opacity:.5}}
  .boardFoot{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .boardFoot .note{font-size:10px;color:var(--dim);margin-left:auto}

  aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
  .pane{background:var(--panel);border:3px solid var(--line);box-shadow:var(--hard);padding:12px}
  .pane h3{margin:0 0 6px;font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:7px}
  .raftBadge{font-size:9px;color:#04250f;background:var(--ok);padding:2px 6px;font-weight:800;border:1px solid #0d5c2c}
  .crewSub{font-size:10px;color:var(--dim);margin:-2px 0 8px}
  .agents{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .agentBtn{display:flex;align-items:center;gap:7px;text-align:left;padding:7px 9px}
  .agentBtn .em{font-size:16px} .agentBtn small{display:block;color:var(--dim);font-size:10px}
  .arrangeRow{margin-top:8px} .arrangeRow button{width:100%}
  .chat{background:var(--bg);border:2px solid var(--line);padding:9px;height:132px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;margin-top:9px}
  .msg{display:flex;gap:7px;font-size:12px;line-height:1.45}
  .msg .av{width:24px;height:24px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
  .msg .who{font-weight:800;font-size:10px} .msg.sys{color:var(--dim);font-size:10px;justify-content:center}
  .proposalBar{display:none;gap:7px;margin-top:8px} .proposalBar.show{display:flex} .proposalBar button{flex:1}
  .proposalBar .accept{background:var(--ok);color:#04250f;border-color:#0d5c2c;border-top-color:#9dffc4;border-left-color:#9dffc4;font-weight:800}

  .opHead{display:flex;align-items:center;justify-content:space-between}
  .opHead .cnt{font-size:10px;color:var(--dim)}
  .opList{background:var(--bg);border:2px solid var(--line);padding:8px;height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font-size:11.5px}
  .opline{line-height:1.4;border-left:3px solid var(--line);padding-left:7px}
  .opline.agent{border-color:var(--agent)} .opline.human{border-color:var(--human)}
  .opline .who{font-weight:700} .opline.agent .who{color:var(--agent)} .opline.human .who{color:var(--human)}
  .opline .ex{color:var(--dim)} .opList .empty{color:var(--dim);font-size:11px}

  .feed{padding:8px 20px 40px}
  .feed h2{font-size:15px;letter-spacing:1px;display:flex;align-items:center;gap:10px}
  .feed h2 small{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:var(--panel);border:2px solid var(--line);border-top-color:#6e6350;border-left-color:#6e6350;box-shadow:var(--hard);padding:10px;display:flex;flex-direction:column;gap:7px}
  .card canvas{width:100%;background:var(--bg);border:1px solid #0e0c07;image-rendering:pixelated}
  .card .t{font-weight:800;font-size:13px} .card .meta{font-size:10px;color:var(--dim)} .card .from{color:var(--bars)}
  .card .nodes{font-size:10px;color:var(--dim)}
  .card .btns{display:flex;gap:6px} .card .btns button{flex:1}
  .empty{color:var(--dim);font-size:12px;padding:16px}

  footer{padding:16px 20px 30px;color:var(--dim);font-size:11px;border-top:3px solid var(--line)}
  footer b{color:var(--text)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1b1200;font-weight:800;padding:9px 16px;border:2px solid #8f6a10;box-shadow:var(--hard);z-index:1000;display:none}
  .toast.show{display:block}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">musik<b>.build</b></div>
    <div class="sub"><span data-i18n="app.tagline"></span> <span class="modetag" id="modeTag">…</span></div>
  </div>
  <div class="spacer"></div>
  <button class="chip" id="langBtn" data-i18n="lang.toggle" title="中 / EN">中</button>
  <div class="acct">
    <div class="chip human" id="actorChip" data-i18n-title="actor.switchTitle" title="Account">🧑 You</div>
    <div class="acctMenu" id="acctMenu">
      <div class="acctHandle" id="acctHandle">@you</div>
      <button class="mini" id="logoutBtn" data-i18n="account.logout">Log out</button>
    </div>
  </div>
</header>

<main>
  <div class="leftcol">
    <!-- LOOP GRAPH -->
    <div class="graphPane">
      <div class="paneTop">
        <h3 data-i18n="graph.title">🧩 Loop Graph</h3>
        <span class="hint" data-i18n="graph.hint"></span>
        <span class="acts">
          <button class="mini" id="addNodeBtn" data-i18n="graph.addNode">＋</button>
          <button class="mini" id="songPlayBtn" data-i18n="graph.playSong">▶</button>
          <label class="alignCtl" data-i18n-title="graph.alignTitle" title="align"><input type="checkbox" id="alignChk"> <span data-i18n="graph.align">Align</span></label>
          <input type="number" id="alignBpm" min="70" max="160" value="120" class="alignBpm" disabled>
          <button class="mini" id="songWavBtn" data-i18n="graph.exportSong">⬇</button>
        </span>
      </div>
      <div class="graphArea" id="graphArea"><svg id="edgeSvg"></svg></div>
    </div>

    <!-- CANVAS (edits selected node) -->
    <div class="board" id="board">
      <div class="loopbar">
        <span class="editing" data-i18n="board.editing">✎</span>
        <span class="tt" id="nodeName">—</span>
        <span class="lineage" id="lineage"><span data-i18n="feed.flipped">↪</span> <b id="lineageName"></b></span>
        <span style="margin-left:auto;display:flex;gap:7px">
          <button class="mini" id="forkBtn" data-i18n="board.flip">↪</button>
          <button class="primary" id="publishBtn" data-i18n="board.publish">⬆</button>
          <button class="mini" id="wavBtn" data-i18n="board.export">⬇</button>
        </span>
      </div>
      <div class="nodeCtrls">
        <button id="playBtn" data-i18n-title="transport.play" title="Play">▶</button>
        <div class="knob"><span><span data-i18n="transport.bpm">BPM</span> <span class="val" id="bpmVal">88</span></span><input type="range" id="bpm" min="70" max="160" value="88"></div>
        <div class="knob"><span><span data-i18n="transport.swing">Swing</span> <span class="val" id="swVal">14%</span></span><input type="range" id="swing" min="0" max="60" value="14"></div>
        <div class="moodBtns"><button id="moodDark" class="on" data-i18n="transport.dark">🌙</button><button id="moodBright" data-i18n="transport.bright">☀️</button></div>
      </div>
      <div id="sections"></div>
      <div class="boardFoot">
        <button class="mini" id="clearBtn" data-i18n="board.clear">🧹</button>
        <button class="mini" id="starterBtn" data-i18n="board.starter">🎲</button>
        <span class="note" data-i18n="board.note"></span>
      </div>
    </div>
  </div>

  <aside>
    <div class="pane">
      <h3><span data-i18n="crew.title">🎛 Crew</span> <span class="raftBadge" data-i18n="crew.badge">RAFT AGENTS</span></h3>
      <div class="crewSub" data-i18n="crew.sub" data-i18n-html></div>
      <div class="agents">
        <button class="agentBtn" data-agent="beat"><span class="em">🥁</span><span>@Beat<small data-i18n="agents.beat"></small></span></button>
        <button class="agentBtn" data-agent="k808"><span class="em">🔊</span><span>@808<small data-i18n="agents.k808"></small></span></button>
        <button class="agentBtn" data-agent="hook"><span class="em">🎹</span><span>@Hook<small data-i18n="agents.hook"></small></span></button>
        <button class="agentBtn" data-agent="flow"><span class="em">🎤</span><span>@Flow<small data-i18n="agents.flow"></small></span></button>
      </div>
      <div class="arrangeRow"><button class="mini" id="arrangeBtn" data-i18n="crew.arrange">✨</button></div>
      <div class="chat" id="chat"></div>
      <div class="proposalBar" id="proposalBar"><button class="accept" id="acceptBtn" data-i18n="crew.accept">✓</button><button id="rejectBtn" data-i18n="crew.reject">✗</button></div>
    </div>

    <div class="pane">
      <div class="opHead"><h3 data-i18n="history.title">📋</h3><span class="cnt"><span id="opCount">0</span> <span data-i18n="history.steps">steps</span></span></div>
      <div class="crewSub" data-i18n="history.sub"></div>
      <div class="opList" id="opList"></div>
    </div>
  </aside>
</main>

<section class="feed">
  <h2><span data-i18n="feed.title">🌊 Jam Feed</span> <small data-i18n="feed.sub"></small></h2>
  <div class="cards" id="cards"></div>
</section>

<footer data-i18n="footer" data-i18n-html></footer>

<div class="toast" id="toast"></div>

<script>
  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
</script>
<script src="i18next.min.js"></script>
<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
